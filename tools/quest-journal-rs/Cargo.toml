[package]
name = "quest-journal"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Author Horizon Quest Journal data packs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[workspace]
